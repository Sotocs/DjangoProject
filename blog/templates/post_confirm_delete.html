{% extends 'base.html' %}
{% load static %}

{% block content %}
  <h1>Удалить запись?</h1>
  <p>Вы уверены, что хотите удалить «{{ object.title }}»?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
  </form>

  <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
{% endblock %}
