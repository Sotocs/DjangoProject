{% extends 'base.html' %}
{% load static %}

{% block content %}
  <h1>{{ post.title }}</h1>
  <p class="text-muted">Дата: {{ post.created_at|date:"d.m.Y H:i" }} • Просмотры: {{ post.views }}</p>

  {% if post.preview_image %}
    <img src="{{ post.preview_image.url }}" class="img-fluid mb-3" style="max-width: 400px;">
  {% endif %}

  <div>{{ post.content|linebreaks }}</div>

  <hr>
  <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">← Назад к списку</a>
{% endblock %}
