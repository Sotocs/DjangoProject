{% extends 'base.html' %}
{% load static %}

{% block content %}
  <h1>{% if object %}Редактировать запись{% else %}Добавить запись{% endif %}</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </form>

  <a href="{% url 'blog:post_list' %}" class="btn btn-secondary mt-2">Отмена</a>
{% endblock %}
