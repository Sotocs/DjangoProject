<header>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/blog">Блог</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
    </nav>
    <div class="ms-auto order-md-2 order-1">
            {% if user.is_authenticated %}
                <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger">
                        Выйти ({{ user.email|default:user.username }})
                    </button>
                </form>
            {% else %}
                <div class="d-flex gap-2">
                    <a href="{% url 'users:login' %}" class="btn btn-outline-primary">Войти</a>
                    <a href="{% url 'users:register' %}" class="btn btn-primary">Регистрация</a>
                </div>
            {% endif %}
        </div>
</div>
</header>
