{% extends "base.html" %}

{% block content %}
  <h1>Удалить продукт</h1>
  <p>Вы уверены, что хотите удалить продукт «{{ object.name }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
  </form>
{% endblock %}
