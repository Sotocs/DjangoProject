{% extends 'base.html' %}

{% block tytle %} Skystore {% endblock %}
{% block content %}
<div class="row">

                    <div class="product-image-block col-md-6 mb-4 mb-md-0">
                {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
                {% endif %}
            </div>

                    <div class="col-12">
                        <div class="product-info-row">
                            <span class="product-name">Название:</span>
                            <span>{{ product.name }}</span>
                        </div>
                        <div class="product-info-row">
                            <span class="product-label">Категория:</span>
                            <span>{{ product.category }}</span>
                        </div>
                        <div class="product-info-row">
                            <span class="product-label">Цена:</span>
                            <span class="fw-bold text-primary">{{ product.price }} ₽</span>
                        </div>
                        <div class="product-info-row">
                            <span class="product-label">Описание:</span>
                        </div>
                        <p class="text-start">{{ product.description }}</p>
                    </div>
                </div>

                <!-- Кнопка возврата -->
                <div class="mt-4 pt-3 border-top">
                    <a href="{% url 'catalog:home' %}" class="text-decoration-none text-primary fw-bold">
                        ← Вернуться на главную
                    </a>
                </div>
{% endblock %}
