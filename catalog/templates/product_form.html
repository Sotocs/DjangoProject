{% extends 'base.html' %}
{% load static %}

{% block content %}
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 class="mb-4">
          {% if object %}Редактировать товар{% else %}Добавить товар{% endif %}
        </h1>

        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- Вот он, твой as_p. Поля будут простыми, без ₽ и красивых рамок -->
          {{ form.as_p }}

          <div class="mt-4 pt-3 border-top d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              {% if object %}Сохранить изменения{% else %}Создать товар{% endif %}
            </button>
            <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
